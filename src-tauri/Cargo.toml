[package]
name = "neirmail"
version = "0.1.0"
description = "Private Neir.io mail for the desktop"
authors = ["Neir.io"]
license = "AGPL-3.0-or-later"
edition = "2021"

[lib]
name = "neirmail_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "=2.11.4", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-notification = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json", "cookies", "multipart", "stream"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "io-util"] }
tokio-tungstenite = { version = "0.24", features = ["native-tls"] }
futures-util = "0.3"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
rusqlite = { version = "0.32", features = ["bundled"] }
aes-gcm = "0.10"
thiserror = "2"
mime_guess = "2"
rand = "0.8"
sha2 = "0.10"
base64 = "0.22"
tauri-plugin-clipboard-manager = "2"
itoa = "1"
percent-encoding = "2"

[profile.release]
codegen-units = 1
lto = "thin"
strip = true

[profile.dev.package.neirmail]
opt-level = 2

[profile.dev.package.sha2]
opt-level = 3

[target."cfg(windows)".dependencies]
notify-rust = "4"
winreg = "0.55"
